# Tooling configuration only — runtime dependencies are pinned in
# requirements.txt (the deploy contract used by render.yaml and CI).
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# Pre-existing findings that are not real defects. Listed explicitly (rather
# than blanket-ignored) so anything NEW in these rules still fails CI.
#
# F821: `Minecraft` is only ever a quoted forward-reference annotation, which
#       ruff cannot see as defined. Harmless at runtime.
# F402: `t` (the i18n helper) is intentionally shadowed by a loop variable in
#       one embed builder; the shadow is deliberate and local.
# F841: dead locals left over from earlier refactors; none affect behaviour.
[tool.ruff.lint.per-file-ignores]
"cogs/members.py" = ["F821", "F402", "F841"]
"cogs/tasks.py" = ["F841"]
"scripts/test_meeting_store.py" = ["F841"]

[tool.pytest.ini_options]
# The suite is a set of standalone `python scripts/test_X.py` runners (there is
# no tests/ package); pytest is configured so `pytest scripts` also works.
testpaths = ["scripts"]
python_files = ["test_*.py"]
# These call store.init() against the LIVE hub and need real credentials.
addopts = "--ignore=scripts/test_meeting_store.py --ignore=scripts/test_mc_hub.py --ignore=scripts/test_memberlinks.py"