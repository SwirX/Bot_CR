name: CI

on:
  push:
    branches: [master, main, nightly]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ffmpeg is a real runtime dependency of the music cog — discord.py spawns
      # it for every track. scripts/test_music_player.py exercises the real
      # enqueue→play_next path, so without ffmpeg on the runner that test dies
      # with "ffmpeg was not found" while passing on any dev machine that has
      # it installed. Installing it keeps the two environments honest.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Lint (ruff — real bug classes only)
        # F = pyflakes: unused/undefined names, f-string gaps, shadowing.
        # E/W style debt is deliberately not gated yet; F-classes are the ones
        # that indicate an actual defect.
        run: ruff check . --select F --exclude .venv-local

      - name: Cog load smoke test
        env:
          BOT_TOKEN: ci-placeholder-token
          APPWRITE_ENDPOINT: https://appwrite.alibks.dev/v1
          APPWRITE_PROJECT_ID: robotics-ops
          APPWRITE_DATABASE_ID: robotics_hub
          APPWRITE_API_KEY: ci-placeholder-key
          PORT: "8080"
        run: python scripts/smoke_test.py

      # Previously 21 of the 24 test files were never executed by CI, so the
      # README's "CI runs the full suite" was fiction. These run for real now.
      # The three excluded files call store.init() against the LIVE hub and
      # need real credentials — they are integration tests, not unit tests.
      - name: Unit test suite (hermetic)
        env:
          BOT_TOKEN: ci-placeholder-token
          APPWRITE_ENDPOINT: https://appwrite.alibks.dev/v1
          APPWRITE_PROJECT_ID: robotics-ops
          APPWRITE_DATABASE_ID: robotics_hub
          APPWRITE_API_KEY: ci-placeholder-key
          PORT: "8080"
        run: |
          set -euo pipefail
          for t in scripts/test_*.py; do
            case "$(basename "$t")" in
              test_meeting_store.py|test_mc_hub.py|test_memberlinks.py)
                echo "— skipping integration test $t (needs live credentials)"
                continue
                ;;
            esac
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done